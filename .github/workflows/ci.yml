name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier
        run: npm run format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build CSS
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Upload CSS artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-css
          path: src/dashboard/public/css/output.css
          retention-days: 7

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CSS artifact
        uses: actions/download-artifact@v4
        with:
          name: compiled-css
          path: src/dashboard/public/css/

      - name: Deploy to preview
        run: echo "Deploy preview would go here"
        # Add your preview deployment logic here (e.g., Vercel, Netlify, etc.)

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CSS artifact
        uses: actions/download-artifact@v4
        with:
          name: compiled-css
          path: src/dashboard/public/css/

      - name: Deploy to Bot-Hosting.net
        run: |
          echo "Deploying to Bot-Hosting.net..."
          # Bot-Hosting.net deployment would be triggered by git push to the connected repository
          # This step is just a placeholder for any additional deployment steps
          echo "Deployment triggered via git push to Bot-Hosting.net"

      - name: Notify Discord
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK }}" ]; then
            curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d '{"content": "🚀 StellarSentry deployed to production!", "embeds": [{"title": "Deployment Successful", "color": 5763719, "fields": [{"name": "Commit", "value": "'${{ github.sha }}'", "inline": true}, {"name": "Branch", "value": "'${{ github.ref_name }}'", "inline": true}]}]}'
          fi